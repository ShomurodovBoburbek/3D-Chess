<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Chess Supreme</title>
    <link rel="stylesheet" href="Chess.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>

<body>
    <div id="game-container"></div>

    <div id="ui-layer">
        <div id="main-menu" class="panel active">
            <div class="logo">
                <h1>Chess</h1>
            </div>
            <div class="menu-buttons">
                <button id="btn-vs-player" class="btn primary">Play Local PVP</button>
                <button id="btn-vs-bot-menu" class="btn primary">Play against AI</button>
                <div id="bot-settings" class="hidden settings-group">
                    <div class="setting-row">
                        <label>AI Difficulty:</label>
                        <select id="bot-difficulty" class="fancy-select">
                            <option value="1">Easy (Depth 1)</option>
                            <option value="2">Medium (Depth 2)</option>
                            <option value="3" selected>Hard (Depth 3)</option>
                            <option value="4">Expert (Depth 4)</option>
                        </select>
                    </div>
                    <div class="setting-row">
                        <label>Your Side:</label>
                        <div class="side-selector">
                            <button class="btn side-btn active" data-side="w">White</button>
                            <button class="btn side-btn outline" data-side="b">Black</button>
                        </div>
                    </div>
                    <button id="btn-start-bot" class="btn success">Start Match</button>
                </div>
                <button id="btn-settings" class="btn secondary">Themes Collection</button>
            </div>
        </div>
        <div id="themes-panel" class="panel hidden">
            <h2>Select Theme</h2>
            <div id="theme-grid" class="theme-grid"></div>
            <button id="btn-back-menu" class="btn secondary back-btn">← Back to Menu</button>
        </div>
        <div id="hud" class="hud hidden">
            <div class="top-bar">
                <div class="status-indicator">
                    <span id="turn-indicator" class="turn-dot white-turn"></span>
                    <span id="turn-text">White to Move</span>
                </div>
                <div id="game-status" class="game-status"></div>
            </div>

            <div class="bottom-controls">
                <button id="btn-undo" class="btn small">Undo Move</button>
                <button id="btn-camera" class="btn small">Reset View</button>
                <button id="btn-resign" class="btn small danger">Resign</button>
            </div>
            <div id="promotion-dialog" class="panel small-panel hidden">
                <h3>Select Promotion</h3>
                <div class="promo-options">
                    <button class="btn icon-btn" data-piece="q">♛</button>
                    <button class="btn icon-btn" data-piece="r">♜</button>
                    <button class="btn icon-btn" data-piece="b">♝</button>
                    <button class="btn icon-btn" data-piece="n">♞</button>
                </div>
            </div>
        </div>
        <div id="game-over-modal" class="panel hidden overlay-modal">
            <h2 id="game-over-title" class="glitch-text">CHECKMATE</h2>
            <p id="game-over-message">White Wins</p>
            <button id="btn-play-again" class="btn primary">Return to Menu</button>
        </div>
    </div>
    <div class="credit">Shomurodov Boburbek Tomonidan Yaratildi &copy; 2026</div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
    <script src="Chess.js"></script>
</body>

</html>
